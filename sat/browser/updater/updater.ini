BrowserWorksMaintenanceDescription=ᱢᱚᱡᱤᱞᱟ ᱨᱚᱠᱷᱨᱚᱠᱷᱟᱣ ᱠᱟᱹᱢᱤᱦᱚᱨᱟ ᱛᱮ ᱟᱢ ᱫᱚ ᱟᱢᱟᱜ ᱠᱚᱢᱯᱭᱩᱴᱚᱨ ᱨᱮ ᱡᱷᱚᱛᱚ ᱠᱷᱚᱱ ᱱᱟᱶᱟ ᱟᱨ ᱨᱩᱠᱷᱤᱭᱟᱹ Waterfox ᱦᱟᱹᱞᱤᱭᱟᱹᱠ ᱢᱮᱱᱟᱜᱼᱟ ᱾ ᱟᱢᱟᱜ ᱚᱱᱞᱟᱭᱤᱱ ᱨᱩᱠᱷᱤᱭᱟᱹ ᱞᱟᱹᱜᱤᱫ ᱛᱮ ᱟᱢᱟᱜ Waterfox ᱱᱚᱶᱟ ᱫᱚᱦᱚ ᱞᱟᱹᱠᱛᱤ ᱠᱟᱱᱟ, ᱟᱨ ᱱᱚᱶᱟ ᱠᱟᱹᱤᱦᱚᱨᱟ ᱪᱟᱹᱞᱩ ᱫᱚᱦᱚ ᱞᱟᱹᱜᱤᱫ BrowserWorks ᱡᱩᱨ ᱮᱢᱮᱫᱟᱭ ᱾
