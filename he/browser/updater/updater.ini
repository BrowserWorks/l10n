BrowserWorksMaintenanceDescription=שירות התחזוקה של BrowserWorks מוודא שברשותך הגרסה האחרונה והמאובטחת ביותר של Waterfox על המחשב שלך. שמירה על Waterfox עדכני חשובה מאד לאבטחה המקוונת שלך, ו־BrowserWorks ממליצים להשאיר את שירות זה פעיל.
