BrowserWorksMaintenanceDescription=BrowserWorks-ի Շահագործման ծառայությունը կհետևի, որ դուք ունենաք Waterfox-ի ամենավերջին տարբերակը: Պահել Waterfox-ը թարմ վիճակում շատ կարևոր է անվտանգության համար ևBrowserWorks-ն խորհուրդ է տալիս միացված պահել այս ծառայությունը:
