InfoText=%MOZ_APP_DISPLAYNAME% installeer tans die bywerkings en sal oor 'n paar sekondes herbegin…
BrowserWorksMaintenanceDescription=Die BrowserWorks-onderhouddiens verseker dat die jongste en veiligste weergawe van Waterfox op die rekenaar is. Ter wille van sekuriteit aanlyn is dit baie belangrik om Waterfox op datum te hou, en BrowserWorks beveel ten sterkste aan dat u dié diens geaktiveer hou.
