BrowserWorksMaintenanceDescription=Abalabirira empereza mu BrowserWorks bakakasa nti olina enkola ya Waterfox ensiga okuba empya ne byokwerinda ebitukiridde ku kompyuta yoo. Okukuma Waterfox nga etukiridde kintu kikulu nyo kulwebyokwerinda byo kumukutu, era BrowserWorks ewagirira ddala nti olekako empereeza eno.
