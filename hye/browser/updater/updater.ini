BrowserWorksMaintenanceDescription=BrowserWorks-ի Շահագործման ծառաիւթիւնը կհետեւի, որ դուք ունենաք Waterfox-ի ամենավերջին տարբերակը։ Պահել Waterfox-ը թարմ վիճակում շատ կարեւոր է անվտանգութեան համար եւ BrowserWorks-ն խորհուրդ է տալիս միացուած պահել այս ծառաիւթիւնը։
