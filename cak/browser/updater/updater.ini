TitleText=Tik'ex ruwäch ri %MOZ_APP_DISPLAYNAME%
InfoText=%MOZ_APP_DISPLAYNAME% nuk'ëx ri', xtitikïr pa jumej…
BrowserWorksMaintenanceDescription=Ri samaj richin rujosq'ixik BrowserWorks, nujikib'a' ri' chi k'o pa ruq'a' ri ruk'isib'äl chuqa' ri ütz ruwäch chi Waterfox pan akematz'ib'. Nak'ëx ruwäch ri Waterfox janila k'atzinel chi re ri achajinïk pa k'amaya'l, ruma ri' ri BrowserWorks nuchilab'ej chawe chi junelïk titzije' re samaj re'.
