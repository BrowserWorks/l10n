BrowserWorksMaintenanceDescription=Il servizi di manteniment di BrowserWorks al sigure che tu vedis la ultime e plui sigure version di Waterfox sul to computer. Tignî inzornât Waterfox al è une vore impuartant pe tô sigurece in rêt e BrowserWorks ti consee di tignî atîf chest servizi.
