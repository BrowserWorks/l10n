BrowserWorksMaintenanceDescription=Сэрвіс суправаджэння BrowserWorks Maintenance Service гарантуе, што вы маеце найноўшую і самую абароненую версію браўзера Waterfox на вашым камп'ютары. Падтрыманне Waterfox у актуальным стане - вельмі важная частка вашай бяспекі ў сеціве, і BrowserWorks настойліва рэкамендуе трымаць гэты сэрвіс уключаным.
