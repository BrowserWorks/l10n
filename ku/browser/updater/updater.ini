InfoText=%MOZ_APP_DISPLAYNAME% niha rojanekirinan saz dike û dê di demeke kin de ji nû ve bê destpêkirin…
BrowserWorksMaintenanceDescription=Servîsa Venêrînê ya BrowserWorksyê teqez dike ka versiyona herî nû ya Waterfoxê li ser kompîtera te sazkirî ye yan na. Ji bo ewlekariya te ya li ser înternetê girîng e ku Waterfox nû be û BrowserWorks pêşniyar dike ku tu vê servîsê vekirî bihêlî.
