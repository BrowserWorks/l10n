InfoText=%MOZ_APP_DISPLAYNAME% మీ తాజాకరణలను స్థాపిస్తోంది, కొద్దిసేపట్లో తిరిగి ప్రారంభమవుతుంది…
BrowserWorksMaintenanceDescription=BrowserWorks నిర్వహణ సేవ మీ సిస్టమ్‌ పై అత్యంత సురక్షితమైన Waterfox వర్షన్ కలిగివుండుటను చూస్తుంది. మీ అన్‌లైన్ రక్షణ కొరకు Waterfox ను తాజాగా ఉంచటమనేది చాలా ముఖ్యం, ఈ సేవను చేతనం చేసివుంచమని BrowserWorks గట్టిగా సిఫార్సు చేస్తోంది.
