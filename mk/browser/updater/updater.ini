BrowserWorksMaintenanceDescription=Сервисот за одржување на BrowserWorks обезбедува да имате најнова и најбезбедна верзија на Waterfox на вашиот компјутер. Одржувањето на Waterfox на најнова верзија е многу важно за вашата безбедност на интернет и BrowserWorks препорачува да не го гасите овој сервис.
