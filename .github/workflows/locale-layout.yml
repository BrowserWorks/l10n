name: Locale layout

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  locale-layout:
    name: Locale layout
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - run: python3 tools/validate_locale_layout.py
