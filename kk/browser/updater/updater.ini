BrowserWorksMaintenanceDescription=BrowserWorks техникалық қызметі компьютеріңізде Waterfox қолданбасының ең соңғы нұсқасы істеп жатқанын қамтамасыз етеді. Waterfox қолданбасының ең соңғы нұсқасын қолдану желідегі қауіпсіздігіңіз үшін міндетті, сол үшін BrowserWorks бұл қызметті іске қосулы түрінде ұстауды қатаң түрде ұсынады.
