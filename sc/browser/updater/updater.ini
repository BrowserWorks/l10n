BrowserWorksMaintenanceDescription=Su servìtziu de mantenimentu de BrowserWorks s’assegurat chi in s’elaboradore tuo ddoe apat semper sa versione de Waterfox prus reghente e segura. Mantènnere Waterfox semper atualizadu est de importu mannu pro sa seguresa tua in lìnia, pro custa resone BrowserWorks cussìgiat de mantènnere ativadu custu servìtziu.
