BrowserWorksMaintenanceDescription=Ang BrowserWorks Maintenance Service ay nagsisigurado na mayroon kang mga pinakabagong at pinaka-secure na bersyon ng Waterfox sa iyong computer. Pagpapanatili ng bagong bersyon ng Waterfox ay napakahalaga para sa iyong online na seguridad, at pinapayo ng BrowserWorks na panatiliin ninyo ang bagong na serbisyong ito.
