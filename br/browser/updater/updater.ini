[Strings]
TitleText=Hizivadur evit %MOZ_APP_DISPLAYNAME%
InfoText=O staliañ ho hizivadurioù emañ %MOZ_APP_DISPLAYNAME% ha loc'het e vo bremaik
BrowserWorksMaintenanceDescription=Ar gwazerezh trezalc'h eus BrowserWorks a wir hoc'h eus an handelv diwezhañ ha diogelañ eus Waterfox staliet war hoc'h urzhiataer. Pouezus-tre eo mirout Waterfox hizivaet evit ho tiogelroez war ar genrouedad hag erbedet groñs eo gant BrowserWorks mirout ar gwazerezh-mañ gweredekaet.
