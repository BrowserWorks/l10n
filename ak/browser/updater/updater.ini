InfoText=%MOZ_APP_DISPLAYNAME% reinstɔl wo ntoso na ɔbɛhyɛ ase a ɛrennkyɛr koraa…
BrowserWorksMaintenanceDescription=BrowserWorks Nsiesie Nhyehyɛe no hwɛ sɛ wo wɔ Waterfox foforo koraa no a ɛsan wɔ banbɔ ho ndimu wɔ wo kɔmputa no so. Ehia paa sɛ Waterfox nea ɛnkyɛɛe koraa no bɛwɔ wo kɔmputa no so aboa wo abɛɛfo kwantenpɔn ho banbɔ, na BrowserWorks kanfo paa sɛ wobɛsɔ saa asom yi esi so.
