InfoText=%MOZ_APP_DISPLAYNAME%-i po instalon përditësimet tuaja dhe do të niset pas pak çastesh…
BrowserWorksMaintenanceDescription=Shërbimi i Mirëmbajtjes BrowserWorks siguron që të keni përherë versionin më të ri dhe më të siguruar të Waterfox-it në kompjuterin tuaj. Mbajta e përditësuar e Waterfox-it është shumë e rëndësishme për sigurinë tuaj internetore dhe BrowserWorks këshillon me forcë që ta mbani të aktivizuar këtë shërbim.
